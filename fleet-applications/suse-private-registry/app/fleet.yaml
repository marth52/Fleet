defaultNamespace: suse-private-registry
name: suse-private-registry
dependsOn:
  - name: cert-manager-configs
  - name: local-path-provisioner
  - name: suse-private-registry-configs
helm:
  releaseName: "suse-private-registry"
  chart: "oci://registry.suse.com/private-registry/1.2/private-registry-helm"
  version: "1.2.0"
  targetNamespace: suse-private-registry
  valuesFiles:
    - values-default.yaml
targetCustomizations:
  - name: spr-lab
    helm:
      chart: "oci://registry.suse.com/private-registry/1.2/private-registry-helm"
      valuesFiles:
        - values-default.yaml
        - lab/values.yaml
    clusterSelector:
      matchLabels:
        environment: spr-lab
diff:
  comparePatches:
    - apiVersion: apps/v1
      kind: Deployment
      name: suse-private-registry-harbor-core
      namespace: suse-private-registry
      jsonPointers:
        - /spec/template/spec/volumes