# Default values for demoapp.
replicaCount: 1

autoscaling:
  enabled: false

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: registry.marth52creative.xyz/custom-images/nginx-unprivileged
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "alpine3.24-slim"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets:
  - name: private-registry

# This is to override the chart name.
nameOverride: ""
fullnameOverride: "demoapp"

global:
  cattle:
    environment: "HomeLab Environment"
    # Set by Fleet templating in fleet.yaml.
    clusterName: ${ if hasKey .ClusterLabels "management.cattle.io/cluster-display-name" }${ get .ClusterLabels "management.cattle.io/cluster-display-name" }${ else }unknown-cluster${ end }
    url: https://rancher.marth52creative.xyz/

serviceAccount:
  create: true
  automount: false
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podSecurityContext:
  fsGroup: 2000

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Service exposure. type selects the variant: ClusterIP (default) or LoadBalancer.
service:
  type: ClusterIP
  clusterIP:
    port: 80
    targetPort: 8080
  loadBalancer:
    port: 443
    targetPort: 8443
    # URL/host shown on the landing page when type is LoadBalancer.
    host: ""
    # Static IP to request for the LoadBalancer. Leave empty to auto-assign.
    IP: ""
ingress:
  enabled: true
  className: "traefik"
  hosts:
      # fleet template function to set the hostname based on the cluster name label, with a fallback for unknown clusters
    - host: "some.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: "example-tls"
      hosts:
        - "some.example.com"
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Mount any number of ConfigMaps. Each entry becomes a volume + volumeMount.
# configMap defaults to name if omitted; subPath/defaultMode are optional; readOnly defaults to true.
configMaps:
  - name: index-html
    mountPath: /usr/share/nginx/html/index.html
    subPath: index.html
  # - name: tls-conf
  #   mountPath: /etc/nginx/conf.d/tls.conf
  #   subPath: tls.conf
  #   readOnly: true

# Mount any number of Secrets. Each entry becomes a volume + volumeMount.
# secret defaults to name if omitted; subPath/defaultMode are optional; readOnly defaults to true.
# secrets:
#   - name: tls-certs
#     secret: example-tls
#     mountPath: /etc/nginx/ssl
#     readOnly: true


persistence:
  storageClass: ""
  existingClaim: ""
  enabled: false
  mountPath: /data
  accessMode: ReadWriteOnce
  size: 1Gi

# Generic escape hatch for volume types not covered by configMaps/secrets (e.g. emptyDir, hostPath).
# additionalVolumes:
#   - name: cache
#     emptyDir: {}
# additionalMounts:
#   - name: cache
#     mountPath: /var/cache/nginx


nodeSelector: {}

tolerations: []

affinity: {}

